[PATHS]
raw_dir = data/raw
processed_dir = data/processed
model_path = models/model.joblib
metrics_path = reports/metrics.json
confusion_matrix_path = reports/confusion_matrix.csv
train_summary_path = reports/train_summary.json

[DATA]
base_url = https://raw.githubusercontent.com/zalandoresearch/fashion-mnist/master/data/fashion
train_limit = 60000
test_limit = 10000
random_seed = 19

[MODEL]
loss = log_loss
penalty = l2
alpha = 0.0001
max_iter = 1000
early_stopping = true 
validation_fraction = 0.15
n_iter_no_change = 10
random_seed = 19

[QUALITY]
min_accuracy = 0.85

[API]
host = 0.0.0.0
port = 8000