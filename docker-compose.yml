services:
    api:
        build:
            context: .
            target: runtime
        image: ${DOCKERHUB_IMAGE:-fashion-mnist-mlops}:${IMAGE_TAG:-local}
        ports:
            - "8000:8000"
        restart: unless-stopped
        healthcheck:
            test:
                - CMD
                - python
                - -c
                - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s
    
    test:
        profiles: ["test"]
        build: 
            context: .
            target: test
        image: fashion-mnist-mlops:test-local
