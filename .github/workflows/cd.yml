name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag produced by CI
        required: true
        default: latest
        type: string

permissions:
  contents: read

jobs:
  container-functional-tests:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout matching source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Resolve Docker image tags
        shell: bash
        env:
          DOCKER_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          EVENT_NAME: ${{ github.event_name }}
          CI_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -z "$DOCKER_IMAGE" ]]; then
            echo "Repository variable DOCKERHUB_IMAGE is not configured" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            image_tag="$CI_COMMIT_SHA"
          else
            image_tag="$MANUAL_IMAGE_TAG"
          fi

          if [[ -z "$image_tag" ]]; then
            echo "Docker image tag could not be resolved" >&2
            exit 1
          fi

          echo "RUNTIME_IMAGE=$DOCKER_IMAGE:$image_tag" >> "$GITHUB_ENV"
          echo "TEST_IMAGE=$DOCKER_IMAGE:test-$image_tag" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Docker images
        run: |
          docker pull "$TEST_IMAGE"
          docker pull "$RUNTIME_IMAGE"

      - name: Run unit tests inside CI image
        run: docker run --rm "$TEST_IMAGE"

      - name: Start runtime container
        run: |
          docker run \
            --detach \
            --name fashion-mnist-api \
            --publish 8000:8000 \
            "$RUNTIME_IMAGE"

      - name: Wait for API health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8000/health
            then
              echo
              echo "API is healthy"
              exit 0
            fi

            echo "Waiting for API: attempt $attempt/30"
            sleep 2
          done

          echo "API did not become healthy" >&2
          docker logs fashion-mnist-api
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install functional-test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run functional tests
        env:
          API_BASE_URL: http://127.0.0.1:8000
        run: pytest -m functional tests/functional -vv

      - name: Collect runtime logs
        if: always()
        run: docker logs fashion-mnist-api || true

      - name: Remove runtime container
        if: always()
        run: docker rm --force fashion-mnist-api || true