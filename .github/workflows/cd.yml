name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag produced by CI
        required: true
        default: latest
        type: string

permissions:
  contents: read

jobs:
  container-functional-tests:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout matching source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Resolve Docker image tags
        shell: bash
        env:
          DOCKER_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          EVENT_NAME: ${{ github.event_name }}
          CI_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -z "$DOCKER_IMAGE" ]]; then
            echo "Repository variable DOCKERHUB_IMAGE is not configured" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            image_tag="$CI_COMMIT_SHA"
          else
            image_tag="$MANUAL_IMAGE_TAG"
          fi

          if [[ -z "$image_tag" ]]; then
            echo "Docker image tag could not be resolved" >&2
            exit 1
          fi

          echo "DOCKERHUB_IMAGE=$DOCKER_IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
          echo "RUNTIME_IMAGE=$DOCKER_IMAGE:$image_tag" >> "$GITHUB_ENV"
          echo "TEST_IMAGE=$DOCKER_IMAGE:test-$image_tag" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Docker images
        run: |
          docker pull "$TEST_IMAGE"
          docker pull "$RUNTIME_IMAGE"

      - name: Run unit tests inside CI image
        run: docker run --rm "$TEST_IMAGE"

      - name: Bootstrap ephemeral Ansible Vault
        shell: bash
        run: |
          gateway_username="fashion-api"
          gateway_password="$(openssl rand -hex 32)"
          echo "::add-mask::$gateway_password"
          echo "HBASE_GATEWAY_USERNAME=$gateway_username" >> "$GITHUB_ENV"
          echo "HBASE_GATEWAY_PASSWORD=$gateway_password" >> "$GITHUB_ENV"
          docker run --rm \
            --user root \
            -e HBASE_GATEWAY_USERNAME="$gateway_username" \
            -e HBASE_GATEWAY_PASSWORD="$gateway_password" \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$TEST_IMAGE" \
            python scripts/bootstrap_ansible_vault.py --force

      - name: Validate Compose configuration
        run: >-
          docker compose
          -f docker-compose.yml
          -f compose.lab2.yml
          -f compose.lab3.yml
          config --quiet

      - name: Build HBase infrastructure image
        run: >-
          docker compose
          -f docker-compose.yml
          -f compose.lab2.yml
          -f compose.lab3.yml
          build hbase

      - name: Start lab compose
        run: >-
          docker compose
          -f docker-compose.yml
          -f compose.lab2.yml
          -f compose.lab3.yml
          up -d --no-build --wait --wait-timeout 240

      - name: Run functional and integration tests
        run: |
          docker run --rm \
            --user root \
            --network host \
            -e API_BASE_URL=http://127.0.0.1:8000 \
            -e HBASE_GATEWAY_PUBLIC_URL=http://127.0.0.1:8080 \
            -e HBASE_GATEWAY_USERNAME="$HBASE_GATEWAY_USERNAME" \
            -e HBASE_GATEWAY_PASSWORD="$HBASE_GATEWAY_PASSWORD" \
            -e ANSIBLE_VAULT_FILE=/app/secrets/hbase.vault.yml \
            -e ANSIBLE_VAULT_PASSWORD_FILE=/app/secrets/ansible-vault-password.txt \
            -v "$PWD/secrets:/app/secrets:ro" \
            -v "$PWD/scenario.json:/app/scenario.json:ro" \
            "$TEST_IMAGE" \
            pytest -p no:cacheprovider \
              -m "functional or integration" \
              tests/functional \
              tests/integration/test_lab2_hbase.py \
              tests/integration/test_lab3_vault.py \
              -vv

      - name: Collect runtime logs
        if: always()
        run: >-
          docker compose
          -f docker-compose.yml
          -f compose.lab2.yml
          -f compose.lab3.yml
          logs --no-color || true

      - name: Stop lab compose
        if: always()
        run: >-
          docker compose
          -f docker-compose.yml
          -f compose.lab2.yml
          -f compose.lab3.yml
          down --volumes --remove-orphans || true