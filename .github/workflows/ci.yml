name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-train-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Lint
        run: ruff check src tests scripts

      - name: Unit tests and coverage
        run: pytest -m unit --cov --cov-report=term-missing --cov-report=xml

      - name: Reproduce ML pipeline
        run: dvc repro

      - name: Resolve image name
        env:
          CONFIGURED_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          image="${CONFIGURED_IMAGE:-fashion-mnist-mlops}"
          echo "IMAGE_NAME=$image" >> "$GITHUB_ENV"
          echo "DOCKERHUB_IMAGE=$image" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Build test container
        run: docker build --target test -t "$IMAGE_NAME:test-${GITHUB_SHA}" .

      - name: Run unit tests inside container
        run: docker run --rm "$IMAGE_NAME:test-${GITHUB_SHA}"

      - name: Build runtime container
        run: |
          docker build \
            --target runtime \
            -t "$IMAGE_NAME:${GITHUB_SHA}" \
            -t "$IMAGE_NAME:latest" \
            .

      - name: Bootstrap ephemeral Ansible Vault
        shell: bash
        run: |
          gateway_username="fashion-api"
          gateway_password="$(openssl rand -hex 32)"
          echo "::add-mask::$gateway_password"
          echo "HBASE_GATEWAY_USERNAME=$gateway_username" >> "$GITHUB_ENV"
          echo "HBASE_GATEWAY_PASSWORD=$gateway_password" >> "$GITHUB_ENV"
          HBASE_GATEWAY_USERNAME="$gateway_username" \
          HBASE_GATEWAY_PASSWORD="$gateway_password" \
            python scripts/bootstrap_ansible_vault.py --force

      - name: Validate Compose configuration
        run: >-
          docker compose
          -f docker-compose.yml
          -f compose.lab2.yml
          -f compose.lab3.yml
          config --quiet

      - name: Build HBase infrastructure image
        run: >-
          docker compose
          -f docker-compose.yml
          -f compose.lab2.yml
          -f compose.lab3.yml
          build hbase

      - name: Start lab compose
        run: >-
          docker compose
          -f docker-compose.yml
          -f compose.lab2.yml
          -f compose.lab3.yml
          up -d --no-build --wait --wait-timeout 420

      - name: Run functional tests
        env:
          API_BASE_URL: http://127.0.0.1:8000
        run: pytest -m functional tests/functional -vv

      - name: Run HBase and Vault integration tests
        env:
          API_BASE_URL: http://127.0.0.1:8000
          HBASE_GATEWAY_PUBLIC_URL: http://127.0.0.1:8080
        run: >-
          pytest -m integration
          tests/integration/test_lab2_hbase.py
          tests/integration/test_lab3_vault.py
          -vv

      - name: Collect integration logs
        if: always()
        run: >-
          docker compose
          -f docker-compose.yml
          -f compose.lab2.yml
          -f compose.lab3.yml
          logs --no-color || true

      - name: Stop lab compose
        if: always()
        run: >-
          docker compose
          -f docker-compose.yml
          -f compose.lab2.yml
          -f compose.lab3.yml
          down --volumes --remove-orphans || true

      - name: Validate Docker Hub publication settings
        if: github.event_name != 'pull_request'
        env:
          DOCKER_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKER_IMAGE" || { echo "DOCKERHUB_IMAGE is missing" >&2; exit 1; }
          test -n "$DOCKER_USERNAME" || { echo "DOCKERHUB_USERNAME is missing" >&2; exit 1; }
          test -n "$DOCKER_TOKEN" || { echo "DOCKERHUB_TOKEN is missing" >&2; exit 1; }

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push runtime and test images
        if: github.event_name != 'pull_request'
        run: |
          docker tag "$IMAGE_NAME:test-${GITHUB_SHA}" "$IMAGE_NAME:test-latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:test-${GITHUB_SHA}"
          docker push "$IMAGE_NAME:test-latest"