name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: fashion_mnist_mlops

jobs:
  quality-train-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
        
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
        
      - name: Lint
        run: ruff check src tests scripts
      
      - name: Unit tests and coverage
        run: pytest -m unit --cov --cov-report=term-missing --cov-report=xml

      - name: Perproduce ML pipeline
        run: dvc repro
    
      - name: Build test container
        run: docker build --target test -t "$IMAGE_NAME:test-${GITHUB_SHA}" .

      - name: Run tests inside container
        run: docker run --rm "$IMAGE_NAME:test-${GITHUB_SHA}"
      
      - name: Build runtime container
        run: docker build --target runtime -t "$IMAGE_NAME:${GITHUB_SHA}" .