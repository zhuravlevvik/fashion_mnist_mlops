services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:9092
        --create
        --if-not-exists
        --topic fashion.predictions.v1
        --partitions 3
        --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    
  api:
    environment:
      PREDICTION_DELIVERY: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PREDICTIONS_TOPIC: fashion.predictions.v1
      KAFKA_DELIVERY_TIMEOUT_SECONDS: "10"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  prediction-consumer:
    build:
      context: .
      target: runtime
    image: ${DOCKERHUB_IMAGE:-fashion-mnist-mlops}:${IMAGE_TAG:-local}
    command: ["python", "-m", "fashion_mnist_mlops.consumer"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os; os.kill(1, 0)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      SECRET_PROVIDER: ansible-vault
      ANSIBLE_VAULT_FILE: /run/config/hbase.vault.yml
      ANSIBLE_VAULT_PASSWORD_FILE: /run/secrets/ansible_vault_password
      HBASE_GATEWAY_URL: http://hbase-gateway:8080
      HBASE_GATEWAY_TIMEOUT_SECONDS: "15"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PREDICTIONS_TOPIC: fashion.predictions.v1
      KAFKA_CONSUMER_GROUP: fashion-hbase-writer-v1
    volumes:
      - ./secrets/hbase.vault.yml:/run/config/hbase.vault.yml:ro
    secrets:
      - ansible_vault_password
    depends_on:
      hbase-gateway:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  kafka-data:
